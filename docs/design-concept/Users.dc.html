<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--muted:#A6AAB2;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
body{margin:0;background:#161617;color:#fff;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wide{font-family:'Archivo',sans-serif;font-stretch:125%}
.screen{position:relative;overflow:hidden;margin:16px;border-radius:36px;border:1px solid rgba(255,255,255,.16);background:#000;min-height:868px}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.38) 1.4px,transparent 1.9px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse at 50% 100%,#000 0,transparent 78%);mask-image:radial-gradient(ellipse at 50% 100%,#000 0,transparent 78%)}
.pill{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;background:#fff;border-radius:22px}
.pill a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:16px;color:#000;text-decoration:none;font:700 12px/1 'Archivo',sans-serif;font-stretch:112%;letter-spacing:0.05em;text-transform:uppercase}
.pill a:hover{background:#EDEDED}
.pill a.on{background:#E3E3E3}
.pill a.cta{background:#000;color:#fff}.pill a.cta:hover{background:#222}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.14);border-radius:24px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.06em}
.b-ok{background:rgba(91,227,160,.13);color:#7CEBB4}
.b-warn{background:rgba(255,184,77,.14);color:#FFC970}
.eyebrow{margin:0;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:14px;border:1px solid transparent;font:700 15px 'Manrope',sans-serif;cursor:pointer;text-decoration:none}
.btn-p{background:#fff;color:#000}.btn-p:hover{background:#E6E6E6;color:#000}
.in{width:100%;height:48px;padding:0 14px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(255,255,255,.04);color:#fff;font:500 15px 'Manrope',sans-serif}
.in:focus{border-color:#fff;outline:2px solid rgba(255,255,255,.45);outline-offset:0}
select.in option{background:#111;color:#fff}
.lbl{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{padding:16px 28px;text-align:left;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl td{padding:16px 28px;font-size:14px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(255,255,255,.04)}
</style>
</helmet>
<div class="screen">
  <div class="dots" aria-hidden="true"></div>

  <header style="position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:28px 40px 8px">
    <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><g fill="#fff"><rect x="2" y="2" width="9" height="9" rx="2"/><circle cx="21" cy="6.5" r="3"/><circle cx="6.5" cy="21" r="3"/><rect x="16.5" y="16.5" width="9" height="9" rx="2"/></g></svg>
      <span class="wide" style="font-weight:800;font-size:20px;letter-spacing:-0.01em">SecureDesk</span>
    </a>
    <nav class="pill" aria-label="Main">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <a href="{{item.href}}" class="{{item.cls}}" aria-current="{{item.cur}}">{{item.label}}</a>
      </sc-for>
      <a href="Main.dc.html" class="cta">Log out
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>
    </nav>
  </header>

  <div role="status" style="position:relative;margin:16px 40px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-radius:18px;background:rgba(255,90,79,.12);border:1px solid rgba(255,90,79,.4);color:#FFB4AC;font-size:14px">
    <span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#FF5A4F;box-shadow:0 0 14px 4px rgba(255,90,79,.7)"></span>
    <strong style="font-weight:700">2 unacknowledged critical security events.</strong>
    <a href="SecurityEvents.dc.html" style="color:#fff;font-weight:700">Review security events</a>
  </div>

  <main style="position:relative;padding:48px 40px 56px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:20px">
        <p class="eyebrow"><span aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:#fff"></span>7 accounts</p>
        <h1 class="wide" style="margin:0;font-weight:300;font-size:clamp(40px,5.4vw,80px);line-height:1;letter-spacing:-0.02em;text-transform:uppercase">Users</h1>
      </div>
      <a href="#" class="btn btn-p">
        New user
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>
    </div>

    <form class="card" style="padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end">
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="q" class="lbl">Search</label>
        <input id="q" class="in" type="search" placeholder="Login or name">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="role" class="lbl">Role</label>
        <select id="role" class="in"><option>All roles</option><option>Administrator</option><option>Manager</option><option>Employee</option><option>Guest</option></select>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="status" class="lbl">Status</label>
        <select id="status" class="in"><option>All statuses</option><option>Active</option><option>Pending first login</option></select>
      </div>
    </form>

    <div class="card" style="overflow-x:auto">
      <table class="tbl">
        <caption style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">User accounts</caption>
        <thead><tr><th scope="col">Login</th><th scope="col">Name</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Created</th></tr></thead>
        <tbody>
          <sc-for list="{{users}}" as="u" hint-placeholder-count="7">
            <tr>
              <td><a href="#" style="font-family:'IBM Plex Mono',monospace;font-weight:500;text-decoration:none">{{u.login}}</a></td>
              <td>
                <span style="display:inline-flex;align-items:center;gap:14px">
                  <span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);font-size:11px;font-weight:700;letter-spacing:0.04em">{{u.initials}}</span>
                  {{u.name}}
                </span>
              </td>
              <td style="color:var(--muted)">{{u.role}}</td>
              <td>
                <sc-if value="{{u.active}}" hint-placeholder-val="{{ true }}">
                  <span class="badge b-ok"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>ACTIVE</span>
                </sc-if>
                <sc-if value="{{u.pending}}" hint-placeholder-val="{{ false }}">
                  <span class="badge b-warn"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>PENDING FIRST LOGIN</span>
                </sc-if>
              </td>
              <td style="color:var(--muted)">2026-11-04</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['Dashboard', 'Dashboard.dc.html', false],
      ['Password', '#', false],
      ['Two-factor', '#', false],
      ['Users', 'Users.dc.html', true],
      ['Security settings', 'SecuritySettings.dc.html', false],
      ['Address blocks', '#', false],
      ['Security events', 'SecurityEvents.dc.html', false]
    ];
    const nav = items.map(([label, href, on]) => ({ label, href, cls: on ? 'on' : '', cur: on ? 'page' : null }));
    const rows = [
      ['ADMIN', 'System Administrator', 'SA', 'Administrator', true],
      ['employee1', 'Katarzyna Wiśniewska', 'KW', 'Employee', true],
      ['employee2', 'Marek Zieliński', 'MZ', 'Employee', false],
      ['guest1', 'Ewa Lewandowska', 'EL', 'Guest', true],
      ['guest2', 'Tomasz Kamiński', 'TK', 'Guest', false],
      ['manager1', 'Anna Kowalska', 'AK', 'Manager', true],
      ['manager2', 'Piotr Nowak', 'PN', 'Manager', false]
    ];
    const users = rows.map(([login, name, initials, role, active]) => ({ login, name, initials, role, active, pending: !active }));
    return { nav, users };
  }
}
</script>
</body>
</html>
