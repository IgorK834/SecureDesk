<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tickets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--muted:#A6AAB2;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
body{margin:0;background:#161617;color:#fff;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wide{font-family:'Archivo',sans-serif;font-stretch:125%}
.screen{position:relative;overflow:hidden;margin:16px;border-radius:36px;border:1px solid rgba(255,255,255,.16);background:#000;min-height:868px}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.38) 1.4px,transparent 1.9px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse at 50% 100%,#000 0,transparent 78%);mask-image:radial-gradient(ellipse at 50% 100%,#000 0,transparent 78%)}
.pill{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;background:#fff;border-radius:22px}
.pill a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:16px;color:#000;text-decoration:none;font:700 12px/1 'Archivo',sans-serif;font-stretch:112%;letter-spacing:0.05em;text-transform:uppercase}
.pill a:hover{background:#EDEDED}
.pill a.on{background:#E3E3E3}
.pill a.cta{background:#000;color:#fff}.pill a.cta:hover{background:#222}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.14);border-radius:24px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.06em}
.b-ok{background:rgba(91,227,160,.13);color:#7CEBB4}
.b-warn{background:rgba(255,184,77,.14);color:#FFC970}
.b-info{background:rgba(143,180,255,.14);color:#A9C4FF}
.eyebrow{margin:0;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:14px;border:1px solid transparent;font:700 15px 'Manrope',sans-serif;cursor:pointer;text-decoration:none}
.btn-p{background:#fff;color:#000}.btn-p:hover{background:#E6E6E6;color:#000}
.btn-s{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.24);min-height:44px;padding:0 18px;font-size:14px}.btn-s:hover{background:rgba(255,255,255,.13)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tbl{width:100%;border-collapse:collapse;min-width:600px}
.tbl th{padding:16px 28px;text-align:left;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl td{padding:20px 28px;font-size:14px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(255,255,255,.04)}
</style>
</helmet>
<div class="screen">
  <div class="dots" aria-hidden="true"></div>

  <header style="position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:28px 40px 8px">
    <a href="#" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><g fill="#fff"><rect x="2" y="2" width="9" height="9" rx="2"/><circle cx="21" cy="6.5" r="3"/><circle cx="6.5" cy="21" r="3"/><rect x="16.5" y="16.5" width="9" height="9" rx="2"/></g></svg>
      <span class="wide" style="font-weight:800;font-size:20px;letter-spacing:-0.01em">SecureDesk</span>
    </a>
    <nav class="pill" aria-label="Main">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="5">
        <a href="{{item.href}}" class="{{item.cls}}" aria-current="{{item.cur}}">{{item.label}}</a>
      </sc-for>
      <a href="Main.dc.html" class="cta">Log out
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>
    </nav>
  </header>

  <main style="position:relative;padding:56px 40px 56px;display:flex;flex-direction:column;gap:40px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:20px">
        <p class="eyebrow"><span aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:#fff"></span>Katarzyna Wiśniewska · Employee</p>
        <h1 class="wide" style="margin:0;font-weight:300;font-size:clamp(40px,5.4vw,80px);line-height:1;letter-spacing:-0.02em;text-transform:uppercase">Tickets</h1>
        <p style="margin:0;font-size:17px;line-height:1.55;color:var(--muted);max-width:560px">Tickets assigned to you and tickets you created.</p>
      </div>
      <a href="#" class="btn btn-p">
        Create ticket
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>
    </div>

    <section class="card" style="overflow:hidden" aria-label="Your tickets">
      <div style="overflow-x:auto">
        <table class="tbl">
          <caption style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Tickets available to your account</caption>
          <thead><tr><th scope="col">Title</th><th scope="col">Status</th><th scope="col">Created</th></tr></thead>
          <tbody>
            <sc-for list="{{tickets}}" as="t" hint-placeholder-count="5">
              <tr>
                <td><a href="#" class="wide" style="font-size:15px;font-weight:500;text-decoration:none;letter-spacing:0.01em">{{t.title}}</a></td>
                <td>
                  <sc-if value="{{t.open}}" hint-placeholder-val="{{ true }}">
                    <span class="badge b-warn"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>OPEN</span>
                  </sc-if>
                  <sc-if value="{{t.progress}}" hint-placeholder-val="{{ false }}">
                    <span class="badge b-info"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 0a4 4 0 1 0 0 8z" fill="currentColor"/><circle cx="4" cy="4" r="3.25" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>IN PROGRESS</span>
                  </sc-if>
                  <sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}">
                    <span class="badge b-ok"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>RESOLVED</span>
                  </sc-if>
                </td>
                <td style="color:var(--muted);white-space:nowrap">{{t.created}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 28px;border-top:1px solid var(--line)">
        <span style="font-size:14px;color:var(--muted)">Page 1 of 1</span>
        <div style="display:flex;gap:12px">
          <button type="button" class="btn btn-s" disabled>Previous</button>
          <button type="button" class="btn btn-s" disabled>Next</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['Dashboard', '#', false],
      ['Tickets', 'Tickets.dc.html', true],
      ['New ticket', '#', false],
      ['Password', '#', false],
      ['Two-factor', '#', false]
    ];
    const nav = items.map(([label, href, on]) => ({ label, href, cls: on ? 'on' : '', cur: on ? 'page' : null }));
    const rows = [
      ['[Ticket title: VPN drops every few minutes]', 'o', 'Nov 5, 2026, 9:42 AM'],
      ['[Ticket title: Printer on floor 2 offline]', 'p', 'Nov 4, 2026, 4:15 PM'],
      ['[Ticket title: Request for a second monitor]', 'p', 'Nov 4, 2026, 11:03 AM'],
      ['[Ticket title: Shared mailbox access]', 'd', 'Nov 3, 2026, 2:27 PM'],
      ['[Ticket title: Laptop battery replacement]', 'd', 'Nov 2, 2026, 8:50 AM']
    ];
    const tickets = rows.map(([title, s, created]) => ({ title, created, open: s === 'o', progress: s === 'p', done: s === 'd' }));
    return { nav, tickets };
  }
}
</script>
</body>
</html>
