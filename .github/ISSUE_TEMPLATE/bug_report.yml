name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a vulnerability, stop here and use the private
        reporting link on the "New issue" page instead. See SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the role you were signed in as and the page or API route. Do not paste real credentials, session cookies or personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release tested
      placeholder: e.g. 378c4f4 or v1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, browser.
